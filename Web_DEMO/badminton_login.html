<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球俱樂部 - 找球友</title>
    <link rel="stylesheet" href="badminton_login.css">
</head>
<body>
    <div class="container">
        <!-- 左側視覺區域 -->
        <div class="left-section">
            <div class="badminton-player">
                <img src="找球友 (3).png" alt="羽球運動員" class="player-image">
            </div>
            
            <!-- 羽球圖示已移除 -->
        </div>

        <!-- 右側登入表單 -->
        <div class="right-section">
            <form id="loginForm" class="form-container">
                <button type="button" class="title-btn">找球友</button>
                
                <div class="form-group">
                    <label class="form-label">User Name</label>
                    <input type="text" id="username" class="form-input" placeholder="請輸入使用者名稱" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" class="form-input" placeholder="請輸入密碼" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">顯示</button>
                    </div>
                </div>
                
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>記住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘記密碼？</a>
                </div>
                
                <button type="submit" class="login-btn">登入</button>
                <button type="button" class="create-account-btn">創建帳號</button>
            </form>
        </div>
    </div>

    <script src="badminton_login.js"></script>
</body>
</html>
