<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽球俱樂部 - 找球友</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='badminton_login.css') }}">
</head>
<body>
    <div class="container">
        <!-- 左側視覺區域 -->
        <div class="left-section">
            <div class="badminton-player">
                <img src="{{ url_for('static', filename='images/找球友 (3).png') }}" alt="羽球運動員" class="player-image">
            </div>
        </div>

        <!-- 右側登入表單 -->
        <div class="right-section">
            <!-- Flash 訊息 -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash-message {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <form method="POST" action="{{ url_for('login') }}" class="form-container">
                <button type="button" class="title-btn">找球友</button>
                
                <div class="form-group">
                    <label class="form-label">使用者名稱</label>
                    <input type="text" name="username" id="username" class="form-input" placeholder="請輸入使用者名稱" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">密碼</label>
                    <div class="password-container">
                        <input type="password" name="password" id="password" class="form-input" placeholder="請輸入密碼" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">顯示</button>
                    </div>
                </div>
                
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>記住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘記密碼？</a>
                </div>
                
                <button type="submit" class="login-btn">登入</button>
            </form>
            
            <a href="{{ url_for('register') }}" class="create-account-btn" style="text-decoration: none; display: block; text-align: center; margin-top: 15px;">創建帳號</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='badminton_login.js') }}"></script>
</body>
</html>
